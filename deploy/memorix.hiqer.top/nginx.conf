# Replace the certificate paths and web root for the target server.
server {
    listen 80;
    listen [::]:80;
    server_name memorix.hiqer.top;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name memorix.hiqer.top;

    root /var/www/memorix.hiqer.top;
    index preview.html;

    ssl_certificate /etc/letsencrypt/live/memorix.hiqer.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/memorix.hiqer.top/privkey.pem;

    location = / {
        try_files /preview/preview.html =404;
    }

    location = /preview {
        return 302 /preview/preview.html;
    }

    location = /preview/ {
        return 302 /preview/preview.html;
    }

    location ^~ /preview/ {
        try_files $uri =404;
        add_header X-Content-Type-Options nosniff always;
    }

    location ^~ /downloads/ {
        try_files $uri =404;
        add_header X-Content-Type-Options nosniff always;
    }

    location ~ ^/desktop-updates/(stable|beta)/latest\.json$ {
        try_files $uri =404;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location ^~ /desktop-updates/releases/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /api {
        proxy_pass http://127.0.0.1:9101/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:9101;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /swagger {
        return 302 /swagger/index.html;
    }

    location ^~ /swagger/ {
        proxy_pass http://127.0.0.1:9101;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://127.0.0.1:9101/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /health/ {
        proxy_pass http://127.0.0.1:9101;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
