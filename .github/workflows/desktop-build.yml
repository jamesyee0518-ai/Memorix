name: Desktop builds

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Create a GitHub release-ready updater bundle"
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v*"
    paths:
      - "desktop/**"
      - "web/**"
      - "src/**"
      - ".github/workflows/desktop-build.yml"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64
            os: macos-14
            rid: osx-arm64
            artifact: memorix-macos-arm64
            bundle_paths: |
              desktop/src-tauri/target/release/bundle/dmg/*.dmg
              desktop/src-tauri/target/release/bundle/macos/*.app
              desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz
              desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
          - name: Windows x64
            os: windows-latest
            rid: win-x64
            artifact: memorix-windows-x64
            bundle_paths: |
              desktop/src-tauri/target/release/bundle/msi/*.msi
              desktop/src-tauri/target/release/bundle/msi/*.msi.sig
              desktop/src-tauri/target/release/bundle/nsis/*.exe
              desktop/src-tauri/target/release/bundle/nsis/*.exe.sig
          - name: Linux x64
            os: ubuntu-24.04
            rid: linux-x64
            artifact: memorix-linux-x64
            bundle_paths: |
              desktop/src-tauri/target/release/bundle/deb/*.deb
              desktop/src-tauri/target/release/bundle/appimage/*.AppImage
              desktop/src-tauri/target/release/bundle/appimage/*.AppImage.sig
              desktop/src-tauri/target/release/bundle/rpm/*.rpm

    env:
      MEMORIX_DESKTOP_RUNTIME_ID: ${{ matrix.rid }}
      MEMORIX_DESKTOP_SELF_CONTAINED: "true"
      MEMORIX_DESKTOP_NO_RESTORE: "true"
      MEMORIX_UPDATER_PUBLIC_KEY: ${{ secrets.MEMORIX_UPDATER_PUBLIC_KEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Install desktop dependencies
        run: npm ci
        working-directory: desktop

      - name: Check desktop version consistency
        run: npm run check:version
        working-directory: desktop
        env:
          RELEASE_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}

      - name: Restore self-contained API runtime
        run: dotnet restore src/KnowledgeEngine.Api/KnowledgeEngine.Api.csproj -r ${{ matrix.rid }}

      - name: Prepare updater release configuration
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_release
        run: npm run prepare:updater-config
        working-directory: desktop

      - name: Build native desktop bundle
        if: ${{ !(startsWith(github.ref, 'refs/tags/v') || inputs.publish_release) }}
        run: npm run build
        working-directory: desktop

      - name: Build signed updater bundle
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_release
        run: npm run build:update
        working-directory: desktop

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.bundle_paths }}
          if-no-files-found: error

  updater-release:
    name: Prepare updater release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          path: release-input

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            node -e "console.log('version=' + require('./desktop/src-tauri/tauri.conf.json').version)" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate Tauri updater manifest
        run: >
          node desktop/scripts/generate-updater-manifest.mjs
          --input release-input
          --output updater-publish/stable/latest.json
          --version "${{ steps.version.outputs.version }}"

      - name: Collect versioned updater artifacts
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          mkdir -p "updater-publish/releases/$version"
          find release-input -type f \( -name '*.app.tar.gz' -o -name '*.app.tar.gz.sig' -o -name '*setup.exe' -o -name '*setup.exe.sig' -o -name '*.msi' -o -name '*.msi.sig' \) \
            -exec cp {} "updater-publish/releases/$version/" \;
          (cd "updater-publish/releases/$version" && sha256sum * > checksums.sha256)

      - uses: actions/upload-artifact@v4
        with:
          name: memorix-desktop-updater-${{ steps.version.outputs.version }}
          path: updater-publish
          if-no-files-found: error

      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "Memorix $version" --generate-notes
          find "updater-publish/releases/$version" -type f -print0 | \
            xargs -0 gh release upload "$GITHUB_REF_NAME" --clobber
          gh release upload "$GITHUB_REF_NAME" updater-publish/stable/latest.json --clobber
